name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release binary
        shell: bash
        run: |
          archive="soroban-upgrade-safeguard-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" soroban-upgrade-safeguard

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release and update formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish binary archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          path: formula-source

      - name: Generate Homebrew formula
        run: >-
          python formula-source/scripts/update_homebrew_formula.py
          --version "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --asset-dir dist
          --formula formula-source/Formula/soroban-upgrade-safeguard.rb
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit formula update
        working-directory: formula-source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/soroban-upgrade-safeguard.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
            exit 0
          fi
          git commit -m "chore: update Homebrew formula to ${RELEASE_TAG}"
          git push origin HEAD:main
